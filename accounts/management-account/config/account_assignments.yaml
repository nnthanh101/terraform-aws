# Account Assignments — APRA CPS 234 audit trail (YAML-managed)
# Schema matches var.account_assignments. principal_idp: INTERNAL for module-created groups.
# account_ids use account NAMES resolved via enable_organizations_lookup=true.
# The module (locals.tf:202) resolves names -> IDs at apply-time via AWS Organizations.
# No 12-digit account IDs are committed here; IDs are resolved from the live Org.

# Break-glass Admin: management-account ONLY. Workload-account Admin requires on-demand, alarm-wired exception (see security review 2026-06-10).
PlatformAdmin:
  principal_name: "PlatformTeam"
  principal_type: "GROUP"
  principal_idp: "INTERNAL"
  permission_sets:
    - "Admin"
  account_ids:
    - "example-management"

PowerUserAccess:
  principal_name: "PowerUsers"
  principal_type: "GROUP"
  principal_idp: "INTERNAL"
  permission_sets:
    - "PowerUser"
  account_ids:
    - "example-management"
    - "example-workload"

AuditReadOnly:
  principal_name: "AuditTeam"
  principal_type: "GROUP"
  principal_idp: "INTERNAL"
  permission_sets:
    - "ReadOnly"
  account_ids:
    - "example-management"
    - "example-workload"

SecurityOps:
  principal_name: "SecurityTeam"
  principal_type: "GROUP"
  principal_idp: "INTERNAL"
  permission_sets:
    - "SecurityAudit"
  account_ids:
    - "example-management"
    - "example-workload"
